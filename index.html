<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dwarf買取価格">
<title>Dwarf買取価格</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // ホーム画面のアイコンから開いたときとパソコンでは、この案内を出さずに価格表へ進む
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycbzNtJ4px7qr9At-ffOWch1ic2zlGMCXyeKbhmel2H4uZYpnj6s_f2c73uuOkm90B11vjw/exec';
    var fromIcon = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
    if (fromIcon || !isMobile) window.location.replace(APP);
    window.APP_URL = APP;
  })();
</script>
<style>
  :root{--navy:#0b2f44;--muted:#66757f;--line:#dbe3e8;--soft:#f4f6f8;--accent:#e8f3fa}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:#1d2730;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
  main{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
  .head{text-align:center}
  .head img{display:block;width:112px;height:112px;margin:0 auto 8px;border-radius:24px;border:1px solid var(--line)}
  h1{margin:0;font-size:22px;color:var(--navy);letter-spacing:.04em}
  .lead{margin:4px 0 22px;font-size:14px;color:var(--muted)}
  h2{margin:0 0 10px;font-size:15px;color:var(--navy)}
  .add{background:var(--accent);border-radius:12px;padding:16px}
  ol{margin:0;padding:0;list-style:none;counter-reset:s}
  ol li{counter-increment:s;position:relative;padding:0 0 10px 32px;font-size:15px}
  ol li:last-child{padding-bottom:0}
  ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;line-height:22px;text-align:center}
  .after{margin:12px 0 0;font-size:13px;color:var(--navy)}
  [hidden]{display:none}
  .open{display:block;margin:20px 0 8px;padding:14px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none}
  .sub{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
  footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <div class="head">
    <img src="icon-512.png" alt="Dwarfのアイコン">
    <h1>Dwarf 買取価格表</h1>
    <p class="lead">ホーム画面に追加すると、次回からすぐ開けます</p>
  </div>

  <section class="add">
    <h2>ホーム画面に追加する</h2>
    <ol id="ios">
      <li>画面の共有ボタン（四角から上向きの矢印）を押します</li>
      <li>「ホーム画面に追加」を押します</li>
      <li>右上の「追加」を押します</li>
    </ol>
    <ol id="android" hidden>
      <li>Chromeの右上の︙を押します</li>
      <li>「ホーム画面に追加」を押します</li>
      <li>「追加」を押します</li>
    </ol>
    <p class="after">追加したドワーフのアイコンから開き、合言葉を入力してください。</p>
  </section>

  <a class="open" id="open" href="#">追加せずに価格表を開く</a>
  <p class="sub">合言葉は、お渡しした案内に記載しています。</p>

  <footer>Dwarf SECONDHAND STORE</footer>
</main>
<script>
  document.getElementById('open').href = window.APP_URL;
  if (/Android/i.test(navigator.userAgent)) {
    document.getElementById('ios').hidden = true;
    document.getElementById('android').hidden = false;
  }
</script>
</body>
</html>
